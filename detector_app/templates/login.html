{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal — Log in</title>
  
  <script>
    document.documentElement.classList.add('entry-pending');
    window.__entryFallback = setTimeout(function(){
      document.documentElement.classList.remove('entry-pending');
    }, 3500);
  </script>

  <style>
    @font-face {
      font-family: 'FreeSans';
      src: local('FreeSans'), local('Helvetica Neue'), local('Arial');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'FreeSans';
      src: local('FreeSans-Bold'), local('HelveticaNeue-Bold'), local('Arial Bold');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Eloquia';
      src: local('Eloquia'), local('Inter-Display'), local('Helvetica Neue'), local('Arial');
      font-weight: 200 800;
      font-display: block;
    }

    :root {
      --W: 1464; --H: 949; --photoW: 836; --paneW: 628; --cardW: 613; --cardH: 922;

      --badge-fs: 13.60px; --badge-fw: 400; --badge-ls: -0.163px; --badge-gap: 10px; --badge-dy: 0px; --badge-ws: 0px;
      --badge-left: 34px; --badge-top: 684px;
      --hl-lh: 1; --hl-wght: 578;
      --hl1-fs: 69.14px; --hl1-ls: -1.936px; --hl1-ws: 0px; --hl1-left: 33.00px; --hl1-top: 750.02px;
      --hl2-fs: 68.95px; --hl2-ls: -1.931px; --hl2-left: 32.00px; --hl2-top: 831.01px;
      --h1-top: 65.00px; --h1-fs: 42.55px; --h1-ls: -2.553px; --h1-ws: 1.300px; --h1-wght: 584;
      --sub-top: 120.00px; --sub-fs: 20.41px; --sub-ls: -0.245px; --sub-ws: -2.000px; --sub-fw: 400; --sub-fwb: 700;
      --fieldpad: 19px;
      --eph-fs: 15.68px; --eph-ls: -0.188px; --eph-left: 17.0px; --eph-fw: 400; --eph-ws: 0px;
      --pph-fs: 17.29px; --pph-ls: -0.698px; --pph-left: 18px; --pph-fw: 400;
      --login-fs: 16.38px; --login-fw: 400; --login-ls: 0.200px; --login-gap: 10px; --login-dy: 0.00px; --login-padl: -12.00px;
      --arrow-w: 13.2px;
      --div-top: 477px; --or-fs: 11.5px; --or-fw: 700; --or-ls: 0.8px; --or-dy: 2.00px; --or-dx: 0.00px;
      --or-line-l: 205px; --or-line-r: 204px;
      --g-gap: 17px; --g-icon: 18.5px;
      --gt-fs: 18.10px; --gt-fw: 400; --gt-ls: -0.217px; --gt-ws: -1.000px; --gt-dy: 1.00px;
      --bt-top: 611.00px; --bt-fs: 16.37px; --bt-fw: 400; --bt-ls: -0.196px; --bt-ws: -2.060px; --bt-fwb: 700; --bt-uo: 3px;
      --card-shadow: 1px 10px 14px rgba(10,14,20,0.14), 0 1px 3px rgba(10,14,20,0.05);
      --cs: 1;

      --ink: #000;          --h1-color: #2c3343;   --sub-grey: #797979;
      --badge-bg: #2f2a27;  --ph: #606060;         --or: #5a5a5b;
      --gtext: #232424;     --bottom: #0a0a0a;
      --btn1: #283139;      --btn2: #293340;
      --inputFill: #fafafa; --inputBorder: #acacae; --pwFill: #f9f9f9;
      --gBorder: #c8c8ca;   --divider: #b1b1b2;     --page: #fefefe;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--page);
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow: hidden;
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: var(--ink);
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 57.1038%;
      overflow: hidden;
    }

    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 50%;
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    .photo-img--wide {
      display: none;
    }

    .scrim {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(7,10,13,.02) 18%, rgba(7,10,13,.12) 48%, rgba(7,10,13,.78) 100%);
    }

    .hero {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 836px;
      height: 949px;
      transform-origin: left bottom;
      pointer-events: none;
    }

    .hero > * {
      pointer-events: auto;
    }

    .badge {
      position: absolute;
      left: var(--badge-left);
      top: var(--badge-top);
      height: 37px;
      padding: 0 16px 0 19px;
      border-radius: 999px;
      background: var(--badge-bg);
      backdrop-filter: blur(7px) saturate(120%);
      -webkit-backdrop-filter: blur(7px) saturate(120%);
      box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);
      display: inline-flex;
      align-items: center;
      gap: var(--badge-gap);
      white-space: nowrap;
      color: #fff;
    }

    .badge-icon {
      width: 17px;
      height: 16.27px;
      position: relative;
      top: -1px;
      flex-shrink: 0;
    }

    #badgeTxt {
      font-size: var(--badge-fs);
      font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls);
      word-spacing: var(--badge-ws);
      transform: translateY(var(--badge-dy));
    }

    .hl-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hl {
      position: absolute;
      font-family: 'Eloquia', sans-serif;
      font-variation-settings: 'wght' var(--hl-wght);
      line-height: var(--hl-lh);
      color: var(--ink);
      white-space: nowrap;
    }

    #hl1 {
      font-size: var(--hl1-fs);
      letter-spacing: var(--hl1-ls);
      word-spacing: var(--hl1-ws);
      left: var(--hl1-left);
      top: var(--hl1-top);
    }

    #hl2 {
      font-size: var(--hl2-fs);
      letter-spacing: var(--hl2-ls);
      left: var(--hl2-left);
      top: var(--hl2-top);
    }

    .pane {
      position: absolute;
      left: 57.1038%;
      right: 0;
      top: 0;
      bottom: 0;
    }

    .card {
      position: absolute;
      left: 1px;
      top: 14px;
      width: 613px;
      height: 922px;
      border-radius: 26px;
      overflow: hidden;
      background: rgba(254, 254, 254, 0.90);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(0, 0, 0, 0.036);
      box-shadow: var(--card-shadow);
    }

    .card-in {
      width: 613px;
      height: 922px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: left top;
    }

    .col {
      position: absolute;
      left: 62px;
      width: 488px;
    }

    #h1 {
      top: var(--h1-top);
      font-family: 'Eloquia', sans-serif;
      font-variation-settings: 'wght' var(--h1-wght);
      font-size: var(--h1-fs);
      letter-spacing: var(--h1-ls);
      word-spacing: var(--h1-ws);
      color: var(--h1-color);
      line-height: 1.05;
      text-align: center;
    }

    #sub {
      top: var(--sub-top);
      font-size: var(--sub-fs);
      letter-spacing: var(--sub-ls);
      word-spacing: var(--sub-ws);
      font-weight: var(--sub-fw);
      color: var(--sub-grey);
      text-align: center;
      line-height: 1.25;
    }

    #sub b {
      font-weight: var(--sub-fwb);
      color: var(--ink);
    }

    .field {
      position: absolute;
      left: 62px;
      width: 489px;
      display: flex;
      align-items: center;
      border-radius: 12px;
    }

    .field input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: 0;
      outline: none;
      font-family: inherit;
      color: var(--ink);
    }

    #email {
      top: 203px;
      height: 61px;
      background: var(--inputFill);
      border: 1.5px solid var(--inputBorder);
      padding: 0 var(--fieldpad);
    }

    #email input {
      font-size: var(--eph-fs);
      letter-spacing: var(--eph-ls);
      word-spacing: var(--eph-ws);
      font-weight: var(--eph-fw);
    }

    #email input::placeholder {
      color: var(--ph);
      opacity: 1;
    }

    #pw {
      top: 273.5px;
      height: 59px;
      background: var(--pwFill);
      border: 0;
      padding: 0 var(--fieldpad);
    }

    #pw input {
      font-size: var(--pph-fs);
      letter-spacing: var(--pph-ls);
      font-weight: var(--pph-fw);
    }

    #pw input::placeholder {
      color: var(--ph);
      opacity: 1;
    }

    #loginBtn {
      position: absolute;
      left: 62px;
      top: 366px;
      width: 489px;
      height: 65.5px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--login-gap);
      padding-left: var(--login-padl);
      padding-right: 4px;
      box-shadow: 0 8px 20px rgba(18,26,34,.16), 0 2px 5px rgba(18,26,34,.10);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--login-fs);
      font-weight: var(--login-fw);
      letter-spacing: var(--login-ls);
      transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, filter .18s ease;
    }

    #loginBtn:hover {
      filter: brightness(1.12);
    }

    #loginBtn:active {
      transform: translateY(1px);
    }

    #loginBtn svg {
      width: var(--arrow-w);
      height: auto;
      display: block;
      transform: translateY(var(--login-dy));
    }

    .divider {
      position: absolute;
      left: 63px;
      top: var(--div-top);
      width: 487px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider i {
      height: 1.5px;
      background: var(--divider);
      border: 0;
      font-style: normal;
    }

    .divider i:first-child {
      flex: 0 0 var(--or-line-l);
    }

    .divider i:last-child {
      flex: 0 0 var(--or-line-r);
    }

    .divider b {
      flex: 1 1 auto;
      text-align: center;
      font-size: var(--or-fs);
      font-weight: var(--or-fw);
      letter-spacing: var(--or-ls);
      color: var(--or);
      transform: translate(var(--or-dx), var(--or-dy));
    }

    #gBtn {
      position: absolute;
      left: 62px;
      top: 535px;
      width: 489px;
      height: 59.5px;
      border: 1.5px solid var(--gBorder);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--g-gap);
      font-family: inherit;
      font-size: var(--gt-fs);
      font-weight: var(--gt-fw);
      letter-spacing: var(--gt-ls);
      word-spacing: var(--gt-ws);
      color: var(--gtext);
      transition: background .18s ease, box-shadow .18s ease, transform .18s cubic-bezier(.2,.7,.3,1);
    }

    #gBtn:hover {
      background: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,.07);
    }

    #gBtn:active {
      transform: translateY(1px);
    }

    #gBtn svg {
      width: var(--g-icon);
      height: var(--g-icon);
      display: block;
      transform: translateY(var(--gt-dy));
      flex-shrink: 0;
    }

    #bottom {
      position: absolute;
      left: 62px;
      width: 489px;
      top: var(--bt-top);
      text-align: center;
      font-size: var(--bt-fs);
      font-weight: var(--bt-fw);
      letter-spacing: var(--bt-ls);
      word-spacing: var(--bt-ws);
      color: var(--bottom);
    }

    #bottom a {
      color: #000;
      font-weight: var(--bt-fwb);
      text-decoration: underline;
      text-underline-offset: var(--bt-uo);
      text-decoration-thickness: 2px;
    }

    :focus-visible {
      outline: 2px solid #2b6cb0;
      outline-offset: 2px;
    }

    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #sub,
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0;
      will-change: transform, opacity, clip-path;
    }

    .entry-pending .card { transform: translateY(12px) scale(.988); }
    .entry-pending .badge { transform: translateY(8px); }
    .entry-pending #hl1,
    .entry-pending #hl2 {
      transform: translateY(16px);
      clip-path: inset(100% 0 0 0);
    }
    .entry-pending #h1,
    .entry-pending #sub { transform: translateY(10px); }
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending #gBtn { transform: translateY(8px); }
    .entry-pending .divider,
    .entry-pending #bottom { transform: translateY(6px); }

    @media (max-width: 699px) {
      .entry-pending .card { transform: translateY(14px); }
      .entry-pending #hl1,
      .entry-pending #hl2 { transform: translateY(12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
      .entry-pending .card,
      .entry-pending .badge,
      .entry-pending #hl1,
      .entry-pending #hl2,
      .entry-pending #h1,
      .entry-pending #sub,
      .entry-pending #email,
      .entry-pending #pw,
      .entry-pending #loginBtn,
      .entry-pending .divider,
      .entry-pending #gBtn,
      .entry-pending #bottom {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        will-change: auto !important;
      }
    }

    /* Mode B — Tablet Portrait */
    body.tabport .photo {
      width: 100%;
      height: var(--band-h);
      position: absolute;
      top: 0;
      left: 0;
    }

    body.tabport .photo-img--tall { display: none; }
    body.tabport .photo-img--wide {
      display: block;
      object-position: 50% 50%;
    }

    body.tabport .pane {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--band-h);
      bottom: 0;
    }

    body.tabport .card {
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      box-shadow: none;
      background: var(--page);
    }

    body.tabport .card-in {
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none !important;
      position: absolute;
    }

    body.tabport .hero {
      position: absolute;
      left: var(--side-margin);
      bottom: var(--tp-hero-b);
      width: auto;
      height: auto;
      transform: none !important;
      display: flex;
      flex-direction: column;
      gap: var(--tp-hero-gap);
      z-index: 2;
    }

    body.tabport .badge {
      position: static;
      transform: scale(var(--badge-k));
      transform-origin: left bottom;
      margin-bottom: 0;
    }

    body.tabport .hl-wrap {
      position: static;
      width: var(--tp-hl-measure, auto);
      display: flex;
      flex-direction: column;
    }

    body.tabport .hl {
      position: static;
      white-space: normal;
      font-size: var(--tp-hero-fs);
      line-height: var(--tp-hero-lh);
    }

    body.tabport .col,
    body.tabport .field,
    body.tabport #loginBtn,
    body.tabport .divider,
    body.tabport #gBtn,
    body.tabport #bottom {
      left: var(--tp-pad);
      width: calc(100% - (var(--tp-pad) * 2));
    }

    body.tabport #h1 {
      top: var(--tp-h1-top);
      font-size: var(--tp-h1-fs);
      letter-spacing: calc(var(--h1-ls) / var(--h1-fs) * var(--tp-h1-fs));
    }

    body.tabport #sub {
      top: var(--tp-sub-top);
      font-size: var(--tp-sub-fs);
      letter-spacing: calc(var(--sub-ls) / var(--sub-fs) * var(--tp-sub-fs));
    }

    body.tabport #email {
      top: var(--tp-em-top);
      height: var(--tp-em-h);
      border-radius: var(--tp-em-r);
      padding: 0 var(--tp-eph-pad);
    }

    body.tabport #email input {
      font-size: var(--tp-eph-fs);
    }

    body.tabport #pw {
      top: var(--tp-pw-top);
      height: var(--tp-pw-h);
      border-radius: var(--tp-em-r);
      padding: 0 var(--tp-eph-pad);
    }

    body.tabport #pw input {
      font-size: var(--tp-eph-fs);
    }

    body.tabport #loginBtn {
      top: var(--tp-btn-top);
      height: var(--tp-btn-h);
      font-size: var(--tp-btn-fs);
      gap: var(--tp-btn-gap);
      padding-left: 0;
    }

    body.tabport #loginBtn svg {
      width: var(--tp-arrow);
    }

    body.tabport .divider {
      top: var(--tp-div-top);
    }

    body.tabport .divider i {
      height: var(--tp-div-h);
      flex: 1 1 auto;
    }

    body.tabport .divider b {
      flex: 0 0 auto;
      padding: 0 var(--tp-or-pad);
      font-size: var(--tp-or-fs);
    }

    body.tabport #gBtn {
      top: var(--tp-g-top);
      height: var(--tp-g-h);
      font-size: var(--tp-gt-fs);
      gap: var(--tp-g-gap);
    }

    body.tabport #gBtn svg {
      width: var(--tp-g-icon);
      height: var(--tp-g-icon);
    }

    body.tabport #bottom {
      top: var(--tp-bt-top);
      font-size: var(--tp-bt-fs);
    }

    /* Mode C — Phone (<700px) */
    body.stacked {
      height: auto;
      min-height: 100%;
      overflow-y: auto;
      background: #fff;
    }

    body.stacked .stage {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    body.stacked .photo {
      position: relative;
      width: 100%;
      height: var(--mobile-hero-h, clamp(244px, 34svh, 304px));
      flex-shrink: 0;
      overflow: hidden;
    }

    body.stacked .photo-img--tall { display: none; }
    body.stacked .photo-img--wide {
      display: block;
      object-position: 64% 48%;
      transform: scale(1.015);
    }

    body.stacked .scrim {
      display: block;
    }

    body.stacked .hero {
      position: absolute;
      left: 20px;
      bottom: 40px;
      width: calc(100% - 40px);
      height: auto;
      transform: none !important;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      z-index: 2;
    }

    body.stacked .badge {
      position: static;
      height: 31px;
      padding: 0 12px;
      background: rgba(24, 27, 30, 0.82);
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }

    body.stacked #badgeTxt {
      font-size: 11px;
    }

    body.stacked .hl-wrap {
      position: static;
      display: flex;
      flex-direction: column;
    }

    body.stacked .hl {
      position: static;
      font-size: clamp(30px, 8.8vw, 38px);
      letter-spacing: -0.035em;
      line-height: 0.96;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.32);
      white-space: normal;
    }

    body.stacked .pane {
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      bottom: auto;
      width: 100%;
      flex: 1 0 auto;
    }

    body.stacked .card {
      position: relative;
      left: 0;
      top: 0;
      width: 100%;
      margin: -28px 0 0;
      border-radius: 28px 28px 0 0;
      background: #fff;
      border: 0;
      box-shadow: 0 -10px 28px rgba(20, 28, 36, 0.10);
      min-height: calc(100svh - var(--mobile-hero-h, clamp(244px, 34svh, 304px)) + 28px);
      overflow: visible;
    }

    body.stacked .card-in {
      position: relative;
      width: 100%;
      height: auto;
      max-width: 500px;
      margin: 0 auto;
      padding: 36px clamp(24px, 7vw, 38px) max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      transform: none !important;
    }

    body.stacked .col,
    body.stacked .field,
    body.stacked #loginBtn,
    body.stacked .divider,
    body.stacked #gBtn,
    body.stacked #bottom {
      position: static;
      width: 100%;
      left: auto;
      top: auto;
    }

    body.stacked #h1 {
      font-size: clamp(31px, 8.8vw, 38px);
      margin-bottom: 8px;
    }

    body.stacked #sub {
      font-size: 15px;

</head>
<body>

  <!-- Layout & Responsive Engine -->
  <script>
    (function() {
      var REF_W = 1464, REF_H = 949, PHOTO_W = 836, PANE_W = 628, CARD_W = 613, CARD_H = 922;
      var CONTENT_H = 697;
      var IMG_W = 1177, IMG_H = 1336, IMG_REF_SCALE = 836 / 1177;
      var PANE_RATIO = PANE_W / REF_W;
      var HERO_W = 681, HERO_H = 219;
      var REF_CARD_ASPECT = 692 / 855;
      var RAMP_HI = 1280, RAMP_LO = 1000, PHOTO_MIN = 0.42;
      var RAMP_LO2 = 820, PHOTO_MIN2 = 0.36;

      var TP = {
        pad: 0.1076, h1Top: 0.08656, h1Fs: 0.06839, subTop: 0.17368, subFs: 0.0309,
        emTop: 0.25435, emH: 0.10257, emR: 0.0202, ephFs: 0.02702, ephPad: 0.0332,
        pwTop: 0.36851, pwH: 0.10839, btnTop: 0.50435, btnH: 0.10981, btnFs: 0.0275,
        arrow: 0.026, btnGap: 0.02, divTop: 0.68222, orFs: 0.02245, orPad: 0.051,
        divH: 0.0026, gTop: 0.76445, gH: 0.09966, gIcon: 0.032, gtFs: 0.03205,
        gGap: 0.026, btTop: 0.89668, btFs: 0.02876, heroFs: 0.1058, badgeH: 0.0742,
        heroLh: 1.1246, heroBot: 0.06493, heroGap: -0.30423, heroSide: 0.0525
      };

      var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

      var photoEl = document.querySelector('.photo');
      var paneEl  = document.querySelector('.pane');
      var cardEl  = document.getElementById('card');
      var cardIn  = document.getElementById('cardIn');
      var heroEl  = document.getElementById('hero');
      var hlWrap  = document.querySelector('.hl-wrap');

      var currentMode = '';

      function clearInline() {
        photoEl.style.cssText = '';
        paneEl.style.cssText = '';
        cardEl.style.cssText = '';
        cardIn.style.cssText = '';
        heroEl.style.cssText = '';
      }

      function setMode(mode) {
        if (currentMode !== mode) {
          clearInline();
          document.body.classList.remove('land', 'tabport', 'stacked');
          if (mode === 'land') document.body.classList.add('land');
          else if (mode === 'tabport') document.body.classList.add('tabport');
          else if (mode === 'phone') document.body.classList.add('stacked');
          currentMode = mode;
        }
      }

      function photoRatio(vw) {
        var base = 1 - PANE_RATIO;
        if (vw >= RAMP_HI) return base;
        if (vw >= RAMP_LO) {
          var t = (vw - RAMP_LO) / (RAMP_HI - RAMP_LO);
          return PHOTO_MIN + t * (base - PHOTO_MIN);
        }
        if (vw >= RAMP_LO2) {
          var t2 = (vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2);
          return PHOTO_MIN2 + t2 * (PHOTO_MIN - PHOTO_MIN2);
        }
        return PHOTO_MIN2;
      }

      function headlineMeasure() {
        var span = document.createElement('span');
        span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:Eloquia,sans-serif;font-variation-settings:"wght" 578;font-size:var(--tp-hero-fs,68px);';
        span.textContent = 'Find Signal to Action Instantly';
        document.body.appendChild(span);
        var w = span.getBoundingClientRect().width;
        document.body.removeChild(span);
        return w;
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw >= 700 && mqLandscape.matches) {
          setMode('land');

          var pr = photoRatio(vw);
          var pw = vw * pr;
          var panew = vw - pw;

          photoEl.style.width = pw + 'px';
          paneEl.style.left = pw + 'px';

          var cs = Math.min(panew / PANE_W, vh / CONTENT_H);
          document.documentElement.style.setProperty('--cs', cs);

          var gapL = 1 * cs;
          var mT = 14 * cs;
          var mB = 13 * cs;
          var mR = 14 * cs;
          var cw = Math.max(CARD_W * cs, panew - gapL - mR);
          var ch = vh - mT - mB;

          cardEl.style.left = gapL + 'px';
          cardEl.style.top = mT + 'px';
          cardEl.style.width = cw + 'px';
          cardEl.style.height = ch + 'px';
          cardEl.style.borderRadius = (26 * cs) + 'px';
          cardEl.style.borderWidth = Math.max(1, cs) + 'px';

          var tx = (cw - CARD_W * cs) / 2;
          cardIn.style.transform = 'translate(' + tx + 'px, 0px) scale(' + cs + ')';

          var imgScale = Math.max(pw / IMG_W, vh / IMG_H);
          var s = Math.min(imgScale / IMG_REF_SCALE, (pw * 0.92) / HERO_W);
          heroEl.style.transform = 'scale(' + s + ')';
          heroEl.style.bottom = '0px';

        } else if (vw >= 700 && mqPortrait.matches) {
          setMode('tabport');

          var band = Math.round(vh * 0.425);
          var sideMargin = Math.round(vw * 0.0525);
          var footerH = Math.round(vh * 0.0297);
          var cardH = vh - band;
          var cardW = vw;
          var S = Math.min(cardH, cardW * REF_CARD_ASPECT);

          document.documentElement.style.setProperty('--band-h', band + 'px');
          document.documentElement.style.setProperty('--side-margin', sideMargin + 'px');

          var badgeK = (band * TP.badgeH) / 37;
          document.documentElement.style.setProperty('--badge-k', badgeK);
          document.documentElement.style.setProperty('--tp-hero-b', Math.round(band * TP.heroBot) + 'px');
          document.documentElement.style.setProperty('--tp-hero-gap', (band * TP.heroGap) + 'px');
          document.documentElement.style.setProperty('--tp-hero-fs', (band * TP.heroFs) + 'px');
          document.documentElement.style.setProperty('--tp-hero-lh', TP.heroLh);

          var m = Math.round(headlineMeasure() * 0.61);
          document.documentElement.style.setProperty('--tp-hl-measure', m + 'px');

          document.documentElement.style.setProperty('--tp-pad', (cardW * TP.pad) + 'px');
          document.documentElement.style.setProperty('--tp-or-pad', (cardW * TP.orPad) + 'px');

          document.documentElement.style.setProperty('--tp-h1-top', (cardH * TP.h1Top) + 'px');
          document.documentElement.style.setProperty('--tp-h1-fs', (S * TP.h1Fs) + 'px');
          document.documentElement.style.setProperty('--tp-sub-top', (cardH * TP.subTop) + 'px');
          document.documentElement.style.setProperty('--tp-sub-fs', (S * TP.subFs) + 'px');
          document.documentElement.style.setProperty('--tp-em-top', (cardH * TP.emTop) + 'px');
          document.documentElement.style.setProperty('--tp-em-h', (cardH * TP.emH) + 'px');
          document.documentElement.style.setProperty('--tp-em-r', (S * TP.emR) + 'px');
          document.documentElement.style.setProperty('--tp-eph-fs', (S * TP.ephFs) + 'px');
          document.documentElement.style.setProperty('--tp-eph-pad', (S * TP.ephPad) + 'px');
          document.documentElement.style.setProperty('--tp-pw-top', (cardH * TP.pwTop) + 'px');
          document.documentElement.style.setProperty('--tp-pw-h', (cardH * TP.pwH) + 'px');
          document.documentElement.style.setProperty('--tp-btn-top', (cardH * TP.btnTop) + 'px');
          document.documentElement.style.setProperty('--tp-btn-h', (cardH * TP.btnH) + 'px');
          document.documentElement.style.setProperty('--tp-btn-fs', (S * TP.btnFs) + 'px');
          document.documentElement.style.setProperty('--tp-arrow', (S * TP.arrow) + 'px');
          document.documentElement.style.setProperty('--tp-btn-gap', (S * TP.btnGap) + 'px');
          document.documentElement.style.setProperty('--tp-div-top', (cardH * TP.divTop) + 'px');
          document.documentElement.style.setProperty('--tp-div-h', Math.max(1, S * TP.divH) + 'px');
          document.documentElement.style.setProperty('--tp-or-fs', (S * TP.orFs) + 'px');
          document.documentElement.style.setProperty('--tp-g-top', (cardH * TP.gTop) + 'px');
          document.documentElement.style.setProperty('--tp-g-h', (cardH * TP.gH) + 'px');
          document.documentElement.style.setProperty('--tp-gt-fs', (S * TP.gtFs) + 'px');
          document.documentElement.style.setProperty('--tp-g-icon', (S * TP.gIcon) + 'px');
          document.documentElement.style.setProperty('--tp-g-gap', (S * TP.gGap) + 'px');
          document.documentElement.style.setProperty('--tp-bt-top', (cardH * TP.btTop) + 'px');
          document.documentElement.style.setProperty('--tp-bt-fs', (S * TP.btFs) + 'px');

        } else {
          setMode('phone');
        }
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout, { passive: true });
      if (mqLandscape.addEventListener) {
        mqLandscape.addEventListener('change', layout);
        mqPortrait.addEventListener('change', layout);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }

      layout();
    })();
  </script>

  <!-- Entrance Timeline Engine -->
  <script>
    (function() {
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      
      function releaseEntrance() {
        if (window.__entryFallback) {
          clearTimeout(window.__entryFallback);
          window.__entryFallback = null;
        }
        document.documentElement.classList.remove('entry-pending');
      }

      if (reducedMotion || !Element.prototype.animate) {
        releaseEntrance();
        return;
      }

      var ease = 'cubic-bezier(.16, 1, .3, 1)';
      var softEase = 'cubic-bezier(.22, 1, .36, 1)';
      var compact = window.matchMedia('(max-width: 699px)').matches;

      var targets = [
        {
          el: document.querySelector('.card'),
          delay: 40,
          duration: 820,
          easing: ease,
          from: {
            opacity: 0,
            transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)'
          }
        },
        {
          el: document.querySelector('.badge'),
          delay: 120,
          duration: 480,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(8px)' }
        },
        {
          el: document.getElementById('hl1'),
          delay: 240,
          duration: 760,
          easing: ease,
          from: {
            opacity: 0,
            transform: compact ? 'translateY(12px)' : 'translateY(16px)',
            clipPath: 'inset(100% 0 0 0)'
          },
          to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
        },
        {
          el: document.getElementById('hl2'),
          delay: 330,
          duration: 760,
          easing: ease,
          from: {
            opacity: 0,
            transform: compact ? 'translateY(12px)' : 'translateY(16px)',
            clipPath: 'inset(100% 0 0 0)'
          },
          to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
        },
        {
          el: document.getElementById('h1'),
          delay: 470,
          duration: 620,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(10px)' }
        },
        {
          el: document.getElementById('sub'),
          delay: 570,
          duration: 560,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(10px)' }
        },
        {
          el: document.getElementById('email'),
          delay: 720,
          duration: 520,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(8px)' }
        },
        {
          el: document.getElementById('pw'),
          delay: 790,
          duration: 520,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(8px)' }
        },
        {
          el: document.getElementById('loginBtn'),
          delay: 930,
          duration: 560,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(8px)' }
        },
        {
          el: document.querySelector('.divider'),
          delay: 1060,
          duration: 440,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(6px)' }
        },
        {
          el: document.getElementById('gBtn'),
          delay: 1150,
          duration: 540,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(8px)' }
        },
        {
          el: document.getElementById('bottom'),
          delay: 1260,
          duration: 500,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(6px)' }
        }
      ];

      var fontTimeout = new Promise(function(resolve) {
        setTimeout(resolve, 650);
      });
      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

      Promise.race([fontsReady, fontTimeout]).then(function() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            var animations = [];

            targets.forEach(function(t) {
              if (!t.el) return;
              var toState = t.to || { opacity: 1, transform: 'none' };
              var anim = t.el.animate([t.from, toState], {
                delay: t.delay,
                duration: t.duration,
                easing: t.easing,
                fill: 'both'
              });
              animations.push(anim);
            });

            releaseEntrance();

            var promises = animations.map(function(a) {
              return a.finished;
            });

            Promise.allSettled(promises).then(function() {
              animations.forEach(function(a) {
                a.cancel();
              });
              animations.length = 0;
            });
          });
        });
      });
    })();
  </script>
</body>
