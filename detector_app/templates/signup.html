{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoad AI - Sign Up</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap");
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Quicksand", sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; overflow-y: auto; padding: 20px 0; }
        .ring { position: relative; width: 500px; height: 580px; display: flex; justify-content: center; align-items: center; }
        .ring i { position: absolute; inset: 0; border: 2px solid #fff; transition: 0.5s; }
        .ring i:nth-child(1) { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; animation: animate 6s linear infinite; }
        .ring i:nth-child(2) { border-radius: 41% 44% 56% 59% / 38% 62% 63% 37%; animation: animate 4s linear infinite; }
        .ring i:nth-child(3) { border-radius: 41% 44% 56% 59% / 38% 62% 63% 37%; animation: animate2 10s linear infinite; }
        @keyframes animate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes animate2 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        .signup { position: absolute; width: 320px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 10; }
        .signup h2 { font-size: 1.8em; color: #fff; }
        .inputBx { width: 100%; }
        .inputBx input { width: 100%; padding: 10px 18px; background: transparent; border: 2px solid #fff; border-radius: 40px; font-size: 1em; color: #fff; outline: none; }
        .inputBx input[type="submit"] { background: linear-gradient(45deg, #00d4ff, #2563eb); border: none; cursor: pointer; color: #fff; font-weight: 700; margin-top: 5px; }
        .links { display: flex; justify-content: center; gap: 8px; color: #cbd5e1; font-size: 0.9em; }
        .links a { color: #00d4ff; text-decoration: none; font-weight: bold; }
        .error-message { color: #ff5555; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="ring">
        <i style="--clr:#00d4ff;"></i>
        <i style="--clr:#2563eb;"></i>
        <i style="--clr:#57d9c7;"></i>
        <div class="signup">
            <h2>Create Account</h2>
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST" action="{% url 'signup' %}" style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
                {% csrf_token %}
                <div class="inputBx"><input type="text" name="username" placeholder="Username" required></div>
                <div class="inputBx"><input type="email" name="email" placeholder="Email Address" required></div>
                <div class="inputBx"><input type="password" name="password" placeholder="Password" required></div>
                <div class="inputBx"><input type="password" name="confirm_password" placeholder="Confirm Password" required></div>
                <div class="inputBx"><input type="submit" value="Register Now"></div>
            </form>
            <div class="links">
                <span>Already registered?</span><a href="{% url 'login' %}">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
